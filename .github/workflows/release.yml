name: Build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build and verify Windows distribution
        working-directory: src
        run: .\gradlew.bat clean verify assembleWindowsDistribution --no-daemon --console=plain
      - name: Package Windows distribution
        shell: pwsh
        run: Compress-Archive -Path src\build\dist\windows\* -DestinationPath Mikohime-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Mikohime-windows-x64
          path: Mikohime-windows-x64.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Check shell scripts
        run: bash -n configurator/linux/Configure_Me.sh src/build.sh src/tooling/verification/linux-configurator-tests.sh
      - name: Test Linux configurator
        run: bash src/tooling/verification/linux-configurator-tests.sh
      - name: Build and verify Linux distribution
        working-directory: src
        run: bash ./gradlew clean packageLinuxDistribution :tooling:verification:verifyLinuxNatives --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: Mikohime-linux-x64
          path: src/build/packages/Mikohime-linux-x64-experimental.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Mikohime-*
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" Mikohime-windows-x64.zip Mikohime-linux-x64-experimental.tar.gz --generate-notes --verify-tag
