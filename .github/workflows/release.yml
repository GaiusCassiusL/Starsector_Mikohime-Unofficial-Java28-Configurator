name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build and verify Windows distribution
        working-directory: src
        run: .\gradlew.bat clean verify packageWindowsDistribution --no-daemon --console=plain
      - name: Test Windows configurator
        shell: pwsh
        run: .\src\tooling\verification\windows-configurator-tests.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Mikohime-windows-x64
          path: src/build/packages/Mikohime-windows-x64-v*.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Check shell scripts
        run: bash -n configurator/linux/Configure_Me.sh src/build.sh src/tooling/verification/linux-configurator-tests.sh
      - name: Test Linux configurator
        run: bash src/tooling/verification/linux-configurator-tests.sh
      - name: Build and verify Linux distribution
        working-directory: src
        run: bash ./gradlew clean packageLinuxDistribution :tooling:verification:verifyLinuxNatives --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: Mikohime-linux-x64
          path: src/build/packages/Mikohime-linux-x64-v*.tar.gz
          if-no-files-found: error